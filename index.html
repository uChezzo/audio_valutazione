<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valutazione audio</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 600px;
    margin: 60px auto;
    padding: 20px;
    text-align: center;
    color: #222;
  }
  .box {
    background: #f7f7f8;
    border-radius: 12px;
    padding: 40px 20px;
  }
  a {
    display: inline-block;
    background: #4a7cff;
    color: white;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Valutazione audio</h1>
    <p>Grazie per partecipare! Clicca il pulsante qui sotto per iniziare.</p>
    <button onclick="apri()" style="background:#4a7cff;color:white;border:none;padding:14px 28px;border-radius:8px;font-size:16px;margin-top:16px;cursor:pointer;">Inizia la valutazione</button>

<script>
function apri() {
  const url = 'https://script.google.com/macros/s/INCOLLA_QUI_IL_TUO_URL/exec';
  window.open(url, '_blank');
}
</script>
  
    <p style="margin-top: 24px; font-size: 13px; color: #666;">Si consiglia l'uso di cuffie o auricolari.</p>
  </div>
</body>
</html>
